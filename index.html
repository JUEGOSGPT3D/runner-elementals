<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Runner Elementals - v2.3.3</title>
  <meta name="description" content="Original 3-Lane Endless Runner (Stage 1) with pseudo-3D projection on HTML5 Canvas.">
  <meta property="og:title" content="Runner Elementals - v2.3.3">
  <meta property="og:description" content="Original 3-Lane Endless Runner (Stage 1) with pseudo-3D projection on HTML5 Canvas.">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      background-color: #121826;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    #gameCanvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    #safeAreaProbe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
  </style>
</head>
<body>
  <!-- Single full-screen 2D canvas for pseudo-3D rendering -->
  <canvas id="gameCanvas"></canvas>
  <!-- Hidden DOM probe for reading CSS env(safe-area-inset-*) values -->
  <div id="safeAreaProbe" aria-hidden="true"></div>

  <script src="game.js?v=2.3.3"></script>
  <script src="projection.js?v=2.3.3"></script>
  <script src="input.js?v=2.3.3"></script>
  <script src="player.js?v=2.3.3"></script>
  <script src="temp-states.js?v=2.3.3"></script>
</body>
</html>
